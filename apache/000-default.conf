<VirtualHost *:80>
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/fixedasset_error.log
    CustomLog ${APACHE_LOG_DIR}/fixedasset_access.log combined
</VirtualHost>